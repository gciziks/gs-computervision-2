[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "olholimpo"
version = "0.1.0"
description = "Detecção de resíduos em imagens e vídeos com treinamento customizado."
requires-python = ">=3.11,<3.14"
license = "AGPL-3.0-only"
dependencies = [
  "torch==2.14.1",
  "torchvision==0.29.1",
  "ultralytics==8.4.211",
  "gradio==6.31.0",
  "opencv-python>=4.10,<5",
  "numpy>=2,<3",
  "Pillow>=11,<13",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]
report = ["reportlab>=4,<5", "pymupdf>=1.26,<2", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]
demo = ["playwright>=1.57,<2"]

[project.scripts]
olholimpo = "olholimpo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/olholimpo", "app"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
